<!DOCTYPE html>
<html lang="en">
    <head>
        {% load bootstrap_5 %}
        {% load static %}
        {% load footer %}
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>eCommerce</title>
        <!-- Renderizado del tag personalizado -->
        {% render_bootstrap_5 %}
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-light bg-light static-top">
            <div class="container">
                <a class="navbar-brand" href="{% url 'Home' %}">Home</a>
                <a class="navbar-brand" href="{% url 'Contacts' %}">Contacts</a>
                <a class="navbar-brand" href="{% url 'Cart' %}">Cart</a>
                <a class="navbar-brand" href="{% url 'Categories' %}">Categories</a>
                <a class="navbar-brand" href="{% url 'Faqs' %}">Faqs</a>
                <a class="navbar-brand" href="{% url 'Login' %}">Login</a>
                <a class="navbar-brand" href="{% url 'Orders' %}">Orders</a>
                <a class="navbar-brand" href="{% url 'Register' %}">Register</a>
                <a class="navbar-brand" href="{% url 'Shop' %}">Shop</a>
            </div>
        </nav>
        <!-- Masthead-->
        <header class="masthead">
            <div class="container position-relative">
                <div class="row justify-content-center">
                    <div class="col-xl-6">
                        <div class="text-center text-white">
                            <!-- Page heading-->
                            <h1 class="mb-5">eCommerce</h1>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="container">
            {% block main %}
            {% endblock %}
        </main>
        <!-- Footer-->
        {% render_footer %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'AppCoder/js/scripts.js' %}"></script>
        <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
    </body>
</html>
